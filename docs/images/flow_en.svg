<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.card{fill:#fff;stroke:#d8dee6}.hero{fill:#eef2ff;stroke:#6d7ff5;stroke-width:1.5}.b{font-size:15px;font-weight:600;fill:#1d232b}.h{font-size:17px;font-weight:700;fill:#3346c8}.s{font-size:12.5px;fill:#5f6875}.line{stroke:#8d96a3;stroke-width:1.5;fill:none}.head{fill:#8d96a3}@media (prefers-color-scheme:dark){.card{fill:#1e2229;stroke:#3a414c}.hero{fill:#1c2238;stroke:#6d7ff5}.b{fill:#e8ebf0}.h{fill:#aab6ff}.s{fill:#a2aab6}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs><rect x="10" y="95" width="160" height="70" rx="12" class="card"/><text x="90" y="124" class="b" text-anchor="middle">User asks</text><text x="90" y="146" class="s" text-anchor="middle">"What's in the tech news?"</text><rect x="10" y="195" width="160" height="70" rx="12" class="card"/><text x="90" y="224" class="b" text-anchor="middle">Chat model</text><text x="90" y="246" class="s" text-anchor="middle">Calls tools as guided</text><line x1="90" y1="165" x2="90" y2="193" class="line" marker-end="url(#a)"/><rect x="215" y="40" width="320" height="240" rx="12" class="hero"/><text x="375" y="72" class="h" text-anchor="middle">DeepDeep Search Manager</text><text x="240" y="108" class="b" text-anchor="start">Right tool</text><text x="240" y="130" class="s" text-anchor="start">Who goes first for each question</text><text x="240" y="166" class="b" text-anchor="start">Switch on failure</text><text x="240" y="188" class="s" text-anchor="start">Out of quota or down: try another</text><text x="240" y="224" class="b" text-anchor="start">Spending cap</text><text x="240" y="246" class="s" text-anchor="start">Stops paid tools; free ones keep working</text><line x1="170" y1="230" x2="213" y2="190" class="line" marker-end="url(#a)"/><rect x="590" y="40" width="360" height="72" rx="12" class="card"/><text x="610" y="70" class="b" text-anchor="start">AstrBot built-in web search</text><text x="610" y="92" class="s" text-anchor="start">SerpApi · Tavily · Brave · Exa · Bocha …</text><line x1="535" y1="160" x2="588" y2="76" class="line" marker-end="url(#a)"/><rect x="590" y="124" width="360" height="72" rx="12" class="card"/><text x="610" y="154" class="b" text-anchor="start">Community plugins and MCP</text><text x="610" y="176" class="s" text-anchor="start">SearXNG · Kimi · Grok · GitHub · arXiv …</text><line x1="535" y1="160" x2="588" y2="160" class="line" marker-end="url(#a)"/><rect x="590" y="208" width="360" height="72" rx="12" class="card"/><text x="610" y="238" class="b" text-anchor="start">DeepDeep's own tools</text><text x="610" y="260" class="s" text-anchor="start">DeepSeek · Tavily · Perplexity · Serper …</text><line x1="535" y1="160" x2="588" y2="244" class="line" marker-end="url(#a)"/><text x="480" y="316" class="s" text-anchor="middle">Every call goes to the log and usage stats → status lights, spending and call records in the dashboard</text></svg>
