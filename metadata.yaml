name: astrbot_plugin_deepdeep
display_name: DeepDeep
desc: 帮机器人选对搜索工具，一家出问题就换另一家，并估算和限制所有付费搜索的花费。不替换你已有的搜索工具，可以和 AstrBot 内置网页搜索、各类搜索插件一起用。面板里能看状态灯、花费和调用日志。
short_desc: 搜索管理器：选对搜索工具，出错自动换，管住花费
version: v1.1.0
author: Turino
repo: https://github.com/liquidtoy001/astrbot_plugin_deepdeep
astrbot_version: ">=4.26.0,<5" # 需要插件页面（pages）和 astrbot.api.web，二者自 4.26.0 起提供
social_link: https://github.com/liquidtoy001
support_platforms: # 只声明容易验证的平台；插件本身没有依赖具体平台的代码
  - aiocqhttp
  - webchat
  - telegram
tags:
  - 搜索
  - 联网搜索
  - 搜索管理
  - DeepSeek
  - 工具
