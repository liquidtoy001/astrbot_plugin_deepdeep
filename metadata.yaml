desc: AstrBot 搜索管理器。让 DeepSeek 搜索、Tavily、AstrBot 内置网页搜索和各类搜索插件分工协作：通用搜索、技术问题与图片、视频、学术、GitHub 等专用搜索各司其职；DeepSeek 优先，故障或超出预算时自动降级；搜索工具健康检测、配置检查和网络连通性说明；支持人民币 / 美元费用上限、各搜索工具用量统计、全工具调用日志和可视化面板。
