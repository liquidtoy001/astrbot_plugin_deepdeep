name: AstrBot 兼容性检查

# 每周用最新的 AstrBot 正式版跑一遍单元测试和兼容性检查，不兼容时自动开 issue。
# 也可以手动运行，指定任意 AstrBot 版本。
on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
    inputs:
      astrbot_tag:
        description: "要检查的 AstrBot 版本（如 v4.29.1），留空为最新正式版"
        required: false
        default: ""
      dry_run:
        description: "只在运行日志里输出 issue 内容，不真正创建"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  tests:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  compat:
    name: 兼容性（AstrBot 官方镜像）
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: 确定 AstrBot 版本
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.astrbot_tag }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/AstrBotDevs/AstrBot/releases/latest --jq .tag_name)
          fi
          echo "AstrBot 版本：$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 检查
        id: check
        run: |
          set +e
          bash scripts/compat_check.sh "${{ steps.version.outputs.tag }}" report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-report
          path: report.md
          if-no-files-found: ignore

      - name: 结果
        run: |
          case "${{ steps.check.outputs.code }}" in
            0) echo "兼容" ;;
            2) echo "::warning::AstrBot ${{ steps.version.outputs.tag }} 的 Docker 镜像还没发布，本周跳过" ;;
            *) echo "::error::与 AstrBot ${{ steps.version.outputs.tag }} 不兼容，详见报告"; exit 1 ;;
          esac

  report:
    name: 汇报
    needs: [tests, compat]
    if: always() && (needs.tests.result == 'failure' || needs.compat.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: compat-report

      - name: 创建或更新 issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.compat.outputs.tag }}
          TESTS: ${{ needs.tests.result }}
          COMPAT: ${{ needs.compat.result }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAG="${TAG:-最新版}"
          title="AstrBot ${TAG} 兼容性检查失败"
          {
            echo "每周兼容性检查发现问题。"
            echo
            echo "- AstrBot 版本：\`${TAG}\`"
            echo "- 单元测试：${TESTS}"
            echo "- 兼容性检查：${COMPAT}"
            echo "- 运行记录：${RUN_URL}"
            echo
            if [ -f report.md ]; then cat report.md; else echo "（没有生成兼容性报告，请查看运行记录）"; fi
          } > body.md

          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run：不会创建 issue。标题：$title"
            cat body.md
            exit 0
          fi

          gh label create compat --repo "$REPO" --color D93F0B \
            --description "AstrBot 兼容性" 2>/dev/null || true
          existing=$(gh issue list --repo "$REPO" --state open --label compat \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file body.md
            echo "已在 #$existing 追加评论"
          else
            gh issue create --repo "$REPO" --title "$title" --label compat --body-file body.md
          fi
